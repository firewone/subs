proxies:
  - name: (leegiiyo) [VMess - grpc] TLS ✅
    server: eduserv3.aiosc.my.id
    port: 443
    type: vmess
    uuid: a57a6acd-1de7-4dd6-a26e-38670fc7802b
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: eduserv3.aiosc.my.id
    network: grpc
    grpc-opts:
      grpc-service-name: vmess-service
    udp: true
  - name: (giimin) [VMess - ws] TLS ✅
    server: eduserv1.aiosc.my.id
    port: 443
    type: vmess
    uuid: c563266e-8cb9-4a69-b9fe-365252237128
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: eduserv1.aiosc.my.id
    network: ws
    ws-opts:
      path: /vmess
      headers:
        Host: eduserv1.aiosc.my.id
    udp: true
proxy-groups:
  - name: FASTSSH-SSHKIT-HOWDY
    type: select
    proxies:
      - (leegiiyo) [VMess - grpc] TLS ✅
      - (giimin) [VMess - ws] TLS ✅
      - BEST-PING
      - DIRECT
  - name: BEST-PING
    type: url-test
    url: http://hi.bonds.id/ping
    interval: 300
    tolerance: 50
    proxies:
      - (leegiiyo) [VMess - grpc] TLS ✅
      - (giimin) [VMess - ws] TLS ✅
rules:
  - MATCH,FASTSSH-SSHKIT-HOWDY
